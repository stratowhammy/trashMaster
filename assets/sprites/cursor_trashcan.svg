<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Handle -->
  <rect x="10" y="0" width="12" height="5" fill="#000000"/>
  <rect x="11" y="1" width="10" height="3" fill="#bbf7d0"/>
  <rect x="13" y="2" width="6" height="3" fill="none"/>
  <mask id="holeStd">
    <rect width="32" height="32" fill="white"/>
    <rect x="13" y="2" width="6" height="3" fill="black"/>
  </mask>
  <rect x="10" y="0" width="12" height="5" fill="#000000" mask="url(#holeStd)"/>
  <rect x="11" y="1" width="10" height="3" fill="#bbf7d0" mask="url(#holeStd)"/>
  
  <!-- Lid -->
  <polygon points="6,4 26,4 28,7 4,7" fill="#000000"/>
  <polygon points="7,5 25,5 27,6 5,6" fill="#4ade80"/>
  <line x1="7" y1="5" x2="16" y2="5" stroke="#dcfce7" stroke-width="1"/>
  <rect x="3" y="7" width="26" height="2" fill="#000000"/>

  <!-- Body (100% Solid Green Fill) -->
  <rect x="4" y="8" width="24" height="20" fill="#000000"/>
  <rect x="5" y="9" width="22" height="18" fill="#22c55e"/>
  <!-- Body Left Highlight & Right Shadow -->
  <rect x="5" y="9" width="3" height="18" fill="#86efac"/>
  <rect x="24" y="9" width="3" height="18" fill="#16a34a"/>

  <!-- 3 Rounded Recessed Grooves -->
  <!-- Left Groove -->
  <rect x="8" y="10" width="4" height="15" rx="1" fill="#000000"/>
  <rect x="9" y="11" width="2" height="13" fill="#15803d"/>
  <line x1="9" y1="11" x2="9" y2="23" stroke="#16a34a" stroke-width="1"/>
  <!-- Center Groove -->
  <rect x="14" y="10" width="4" height="15" rx="1" fill="#000000"/>
  <rect x="15" y="11" width="2" height="13" fill="#15803d"/>
  <line x1="15" y1="11" x2="15" y2="23" stroke="#16a34a" stroke-width="1"/>
  <!-- Right Groove -->
  <rect x="20" y="10" width="4" height="15" rx="1" fill="#000000"/>
  <rect x="21" y="11" width="2" height="13" fill="#15803d"/>
  <line x1="21" y1="11" x2="21" y2="23" stroke="#16a34a" stroke-width="1"/>

  <!-- Base -->
  <rect x="6" y="27" width="20" height="3" fill="#000000"/>
  <rect x="7" y="28" width="18" height="1.5" fill="#16a34a"/>
  <line x1="7" y1="28" x2="16" y2="28" stroke="#86efac" stroke-width="1"/>
</svg>